# Docker Compose para la PRODUCCION
version: "3.9"

services:
  portal-consejos:
    #usar imagen pre-construida (no build)
    image: portal-consejos:latest
    container_name: portal-consejos
    
    #solo accesible localmente en puerto 8080
    #Nginx (proxy reverso) la publica por 80/443
    ports:
      - "127.0.0.1:8080:80"
    
    restart: always
    
    #variables de entorno de producción
    env_file:
      - .env.production
    
    environment:
      - NEXT_PUBLIC_SITE_URL=https://portal.slep.cl
    
    #health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    
    #logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        
  #nginx Proxy Reverso HTTPS
  nginx:
    image: nginx:alpine
    container_name: nginx-portal
    
    #puertos publicos
    ports:
      - "80:80"      # HTTP redirige a HTTPS
      - "443:443"    # HTTPS (con certificado)
    
    #volumenes
    volumes:
      - ./nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx-logs:/var/log/nginx
    
    environment:
      - NGINX_HOST=portal.slep.cl
      - NGINX_PORT=80
    
    depends_on:
      - portal-consejos
    
    restart: always
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  nginx-logs:
