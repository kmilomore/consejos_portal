#nginx Configuration PRODUCCIÓN
#Rate Limiting Zones 
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=500r/m;

#Redirigir HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name portal.slep.cl www.portal.slep.cl;

    # Metadata
    server_tokens off;
    
    # Health check endpoint (sin redirigir)
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Redirigir TODO a HTTPS excepto health check
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS - Servidor Principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.slep.cl www.portal.slep.cl;

    #Ocultar versión de Nginx
    server_tokens off;

    #SSL/TLS Certificates
    #Generar con: certbot certonly --nginx -d portal.slep.cl
    ssl_certificate /etc/letsencrypt/live/portal.slep.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.slep.cl/privkey.pem;
    
    #SSL Protocols - Solo TLS 1.2+
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    
    #SSL Session
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    #HSTS - Force HTTPS por 1 año
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    #Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com https://*.supabase.co;" always;

    #Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/json 
        application/javascript 
        application/xml+rss 
        application/rss+xml
        application/atom+xml
        image/svg+xml;
    gzip_disable "msie6";

    #Client Limits
    client_max_body_size 50M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    #Upstream Backend
    upstream portal_backend {
        # Connect to portal-consejos container on port 8080
        server portal-consejos:80;
        keepalive 32;
    }

    #Static Assets Cache 1 año Next.js agrega hash a los nombres
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|eot|ttf|otf)$ {
        proxy_pass http://portal_backend;
        proxy_cache_valid 200 1y;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status $upstream_cache_status;
        expires 1y;
        access_log off;
    }

    #HTML Files No cache
    location ~* \.html?$ {
        proxy_pass http://portal_backend;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        expires -1;
    }

    #API Routes
    location /api/ {
        # Rate limiting para API
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://portal_backend;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    #Auth Routes: /auth/login CRÍTICO: Rate limiting ESTRICTO
    location = /auth/login {
        #MÁS RESTRICTIVO: 5 req/min = 1 login attempt cada 12 segundos máximo
        limit_req zone=auth_login burst=2 nodelay;
        limit_req_status 429;
        
        proxy_pass http://portal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/";
        proxy_cookie_flags ~ secure httponly samesite=lax;
    }

    #Auth Routes: Otros Google OAuth callback, etc
    location /auth/ {
        limit_req zone=api burst=10 nodelay;
        
        proxy_pass http://portal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/";
        proxy_cookie_flags ~ secure httponly samesite=lax;
    }

    #WebSocket para Supabase Realtime
    location /realtime/ {
        proxy_pass http://portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    #SPA Fallback Unknown routes a index.html
    location / {
        #Rate limiting general
        limit_req zone=general burst=50 nodelay;
        
        proxy_pass http://portal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        error_page 404 =200 /index.html;
    }

    #Health Check Endpoint
    location /healthz {
        access_log off;
        proxy_pass http://portal_backend;
        proxy_connect_timeout 5s;
    }

    #denegar acceso a archivos sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.env {
        deny all;
        access_log off;
        log_not_found off;
    }

    #los logs de nginx se guardan en /var/log/nginx/portal-access.log y portal-error.log
    access_log /var/log/nginx/portal-access.log;
    error_log /var/log/nginx/portal-error.log warn;
}

#redirect www to non-www para HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.portal.slep.cl;
    
    ssl_certificate /etc/letsencrypt/live/portal.slep.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.slep.cl/privkey.pem;
    
    return 301 https://portal.slep.cl$request_uri;
}
