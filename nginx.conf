#Nginx Configuración para Portal Consejos Escolares

# Gzip compression (reduce tamaño de assets)
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
gzip_min_length 1000;
gzip_proxied any;

server {
    listen 80;
    server_name _;
    
    # Root directory con archivos estáticos
    root /usr/share/nginx/html;
    
    # Charset
    charset utf-8;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # CORS para Supabase (ajusta según dominio)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    
    # Cache: archivos estáticos por 1 año (Next.js agrega hash a los nombres)
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Cache: imágenes por 30 días
    location ~* \.(jpg|jpeg|png|gif|webp|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    
    # No cache: HTML (siempre fresco)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    # Ruta raíz
    location / {
        # Sirve index.html para rutas no encontradas (SPA routing)
        try_files $uri $uri/ /index.html;
    }
    
    # Health check endpoint (usado por Docker)
    location /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
    
    # Denegar acceso a archivos sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
